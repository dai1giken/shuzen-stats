name: monthly-update

# 大規模修繕統計ビューアの月次再生成と公開。
#
# 設計の要点:
#   - 第一技研PCにも自宅PCにも依存しない。GitHub 上だけで完結する
#   - ESTAT_APP_ID は Secrets に置く。リポジトリには絶対に入れない
#   - basis.json に取得日が入るので毎回コミットは入る。元データが伸びたかは
#     コミットメッセージで区別する（「月次更新（A → B）」/「再生成（… のまま）」）
#   - 公開するのは index.html / ogp.png / sitemap.xml / pref（47県）。ソースは配らない

on:
  schedule:
    - cron: "0 22 9 * *"      # 毎月10日 07:00 JST（UTC では9日22:00）。デフレーターの公表後
  workflow_dispatch:           # 手動実行
  push:
    branches: [main]

permissions:
  contents: write              # 生成物の書き戻しと Release の作成に必要
  issues: write                # 月次のお知らせ Issue を立てるのに必要
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存を入れる（OGP画像に Pillow と日本語フォントが要る）
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 更新前の最新月を控える
        id: before
        run: python -c "import json;print('month='+json.load(open('basis.json',encoding='utf-8'))['deflator']['months'][-1])" >> "$GITHUB_OUTPUT"

      - name: e-Stat から基準値を取得
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          if [ -z "$ESTAT_APP_ID" ]; then
            echo "::warning::ESTAT_APP_ID が未設定です。既存の basis.json でページだけ再生成します。"
          else
            python update_basis.py
          fi

      - name: 更新後の最新月を控える
        id: after
        run: python -c "import json;print('month='+json.load(open('basis.json',encoding='utf-8'))['deflator']['months'][-1])" >> "$GITHUB_OUTPUT"

      - name: ページと OGP を生成
        run: |
          python build.py
          python make_ogp.py

      - name: 生成物をリポジトリへ書き戻す
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE="${{ steps.before.outputs.month }}"
          AFTER="${{ steps.after.outputs.month }}"
          if [ "$BEFORE" = "$AFTER" ]; then
            MSG="chore: 再生成（元データは $AFTER のまま）"
            echo "::notice::元データは $AFTER のままです。取得日だけが更新されました。"
          else
            MSG="chore: 月次更新（$BEFORE → $AFTER）"
            echo "::notice::元データが $BEFORE から $AFTER へ伸びました。"
          fi
          git add basis.json page.html index.html ogp.png sitemap.xml robots.txt llms.txt pref city nonres deflator
          if git diff --cached --quiet; then
            echo "差分なし。コミットしません。"
          else
            git commit -m "$MSG"
            git push
          fi

      - name: 公開するファイルだけ集める
        run: |
          mkdir -p _site
          cp index.html ogp.png sitemap.xml robots.txt llms.txt _site/
          # Apache は .txt に charset を付けないので llms.txt の日本語が化ける。
          # リポジトリでは htaccess.txt という名前で持ち、配置時に .htaccess にする
          # （ドットで始まるファイルは取り違えやすく、cp -r で漏れやすい）。
          cp htaccess.txt _site/.htaccess
          # 構造化データの distribution が指す実体。中身は政府統計の公表値のみ
          cp basis.json _site/
          cp -r pref city nonres deflator column _site/
          touch _site/.nojekyll
          echo "公開ファイル数: $(find _site -type f | wc -l)"
          # 手でアップロードする用。トップに shuzen-stats/ を作っておくと、
          # www/htdocs 直下で解凍するだけで済み、既存ファイルに混ざる事故を防げる。
          # **公開領域は www ではなく www/htdocs。**www に置くと URL から見えない。
          # .nojekyll は GitHub Pages 専用なので入れない。
          mkdir -p upload/shuzen-stats
          cp -r _site/. upload/shuzen-stats/
          rm -f upload/shuzen-stats/.nojekyll
          rm -rf upload/shuzen-stats/column
          # column/ は企業サイト側（htdocs/column/）の直下に置くものなので、
          # shuzen-stats/ の外、upload/ 直下に置く。_site の中に入れたのは
          # GitHub Pages 側の表示確認用で、手動アップロードの構成とは別。
          cp -r column upload/column
          # ホスト直下（htdocs/ 直下）に置く robots.txt・sitemap.xml（企業サイト全体ぶん）。
          # /shuzen-stats/ 配下のものとは別物で、これが無いとクローラが読む
          # 本来の robots.txt / sitemap.xml が更新されないままになる。
          cp _root/robots.txt upload/robots.txt
          cp _root/sitemap.xml upload/sitemap.xml
          echo "アップロード用ファイル数: $(find upload -type f | wc -l)" 

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # ---- 月次のお知らせ ----------------------------------------------
      # **push のたびには走らせない。**毎回 Release と Issue ができてしまう。
      # 定期実行（毎月10日）と手動実行のときだけ。
      #
      # メールは GitHub に送らせる。SMTP の認証情報をどこにも置かずに済み、
      # 社内PCの稼働にも依存しない。Issue の @メンションで本人に通知が飛ぶ。
      - name: アップロード用 ZIP を作る
        if: github.event_name != 'push'
        run: |
          cd upload && zip -qr ../shuzen-stats.zip shuzen-stats column robots.txt sitemap.xml && cd ..
          ls -l shuzen-stats.zip

      - name: Release に ZIP を載せ、手順つきの Issue を立てる
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          YM=$(TZ=Asia/Tokyo date +%Y-%m)
          WA=$(TZ=Asia/Tokyo date "+%Y年%-m月")
          TAG="upload-$YM"
          ASSET="https://github.com/${{ github.repository }}/releases/download/$TAG/shuzen-stats.zip"

          # Release（ZIP の置き場。同月に再実行したら上書きする）
          NOTE="dai1giken.co.jp/shuzen-stats/ に手でアップロードするための ZIP です。手順は同月の Issue に書いてあります。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" shuzen-stats.zip --clobber
          else
            gh release create "$TAG" shuzen-stats.zip --title "$WA 分 アップロード用ファイル" --notes "$NOTE"
          fi

          # 本文は .github/monthly-upload.md に置いてある。
          # ヒアドキュメントの終端は行頭に無いと効かず、YAML のブロック内には
          # 行頭を置けない。テンプレートを別ファイルにするとその問題ごと消える。
          sed -e "s|__WA__|$WA|g" -e "s|__ASSET__|$ASSET|g" .github/monthly-upload.md > /tmp/issue.md

          gh issue create --title "【$WA】統計サイトの更新ファイルをアップロードしてください" --body-file /tmp/issue.md --assignee yojirofujioka

      # 本番は dai1giken.co.jp/shuzen-stats/（Bizメール&ウェブ）。
      # FTP の自動化はユーザー数上限で専用アカウントが作れず見送ったので、
      # 月次でここから ZIP を取り出して手でアップロードする。
      # 展開すると shuzen-stats/ ができるので、www/ 直下で解凍すればよい。
      - name: 手動アップロード用の ZIP を残す
        uses: actions/upload-artifact@v4
        with:
          name: shuzen-stats-upload
          path: upload/
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
